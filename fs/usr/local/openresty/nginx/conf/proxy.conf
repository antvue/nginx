# NOTE: no `map` here on purpose. `map` is http-context-only, so keeping it out lets this
# file be included inside server/location blocks. Each site config defines its own websocket
# upgrade map (e.g. `map $http_upgrade $et_connection_upgrade`) to avoid a global name clash.

proxy_redirect          off;
proxy_set_header        Host            $host;
proxy_set_header        X-Real-IP       $remote_addr;
proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
client_max_body_size    10m;
client_body_buffer_size 128k;
#proxy_connect_timeout   90;
#proxy_send_timeout      90;
#proxy_read_timeout      90;
proxy_buffers           32 4k;
proxy_set_header        X-Forwarded-Proto $scheme; # for spring gateway

